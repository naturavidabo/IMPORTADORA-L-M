<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17382d"><title>L&M Importadora V1.1</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#1d2823;background:#f3f6f4}*{box-sizing:border-box}body{margin:0}.app{min-height:100vh;padding-bottom:82px}header{height:72px;background:#17382d;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:13px;background:#d9b66e;color:#17382d;display:grid;place-items:center;font-weight:900}.brand strong,.brand span{display:block}.brand span{font-size:11px;opacity:.68}.profile{text-align:right}.profile small{display:block;opacity:.65}.profile select{background:transparent;color:white;border:0;font-weight:800;max-width:155px}.profile option{color:#222}main{max-width:1080px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#17382d,#285b49);color:#fff;padding:22px;border-radius:22px;display:flex;justify-content:space-between;align-items:end;gap:10px}.hero small{letter-spacing:1.5px;color:#e0c17f}.hero h1{margin:5px 0 0;font-size:24px}.hero p{margin:4px 0;opacity:.75}.action,.primary,.secondary,.danger{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}.action,.primary{background:#d9b66e;color:#17382d}.secondary{background:#edf3ef;color:#24483a}.danger{background:#f8e8e5;color:#9a473c}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 22px}.stat{background:#fff;padding:14px;border-radius:16px;border:1px solid #e1e7e3}.stat span,.stat small{display:block;color:#718078;font-size:12px}.stat b{display:block;font-size:22px;margin:4px 0}.toolbar{display:flex;gap:8px;align-items:center;margin:12px 0}.search{flex:1;background:#fff;border:1px solid #dfe5e1;border-radius:13px;padding:10px 12px;display:flex;gap:7px}.search input{border:0;outline:0;width:100%;font-size:14px;background:transparent}.products{display:grid;gap:8px}.product{background:#fff;border:1px solid #e2e8e4;border-radius:15px;padding:9px;display:flex;align-items:center;gap:10px}.product.click{cursor:pointer}.thumb{width:48px;height:48px;border-radius:11px;background:#eef2ef;display:grid;place-items:center;font-size:25px;flex:none;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.info{flex:1;min-width:0}.info b,.info span,.info small{display:block}.info b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info span{font-size:12px;color:#657269}.info small{font-size:10px;color:#98a099}.numbers{text-align:right;min-width:78px}.numbers b,.numbers span{display:block}.numbers span{font-size:12px;color:#48765e;margin-top:4px}.numbers span.low{color:#b65844;font-weight:800}.rowactions{display:flex;gap:5px;margin-left:4px}.iconbtn{border:0;background:#f0f4f1;border-radius:8px;padding:7px;cursor:pointer}.title h1{margin:5px 0 0}.title p{margin:4px 0 12px;color:#718078}.salegrid{display:grid;grid-template-columns:1.35fr .85fr;gap:14px}.cart,.card{background:#fff;border:1px solid #e1e7e3;border-radius:17px;padding:14px}.cart{height:max-content;position:sticky;top:85px}.cartrow{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #eef1ee;padding:10px 0}.cartrow:first-of-type{border-top:0}.qty button{border:0;border-radius:7px;width:26px;height:26px}.total{border-top:1px solid #dde4df;padding-top:13px;display:flex;justify-content:space-between;font-size:18px}.primary{width:100%;margin-top:10px}.primary:disabled{opacity:.45}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:12px;color:#66736b;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d8e1db;border-radius:10px;font:inherit;background:#fff}.network{background:#fff;border:1px solid #e2e8e4;border-radius:17px;padding:13px;margin-bottom:10px}.networkhead{display:flex;justify-content:space-between;gap:10px;margin-bottom:9px}.pill{font-size:11px;padding:4px 8px;border-radius:999px;background:#edf5ef;color:#3f7657}.pill.off{background:#f1f1f1;color:#888}.requests{display:grid;gap:9px}.request{background:#fff;border:1px solid #e1e7e3;border-radius:15px;padding:13px}.requesttop{display:flex;justify-content:space-between;gap:8px}.request small{color:#748178}.empty{background:#fff;border:1px dashed #ccd6cf;border-radius:20px;padding:42px 18px;text-align:center;color:#758078}.settingsgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.permission{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid #eef1ee}.permission:first-child{border-top:0}.notice{padding:11px 13px;border-radius:12px;background:#edf5ef;color:#315c46;font-size:13px;margin-bottom:12px}.receipt{font-size:13px}.receipt h3{text-align:center;margin-bottom:3px}.receipt .line{display:flex;justify-content:space-between;padding:5px 0}.receipt .sum{border-top:1px solid #ddd;margin-top:7px;padding-top:8px;font-weight:900}.modalback{position:fixed;inset:0;background:#0008;display:grid;place-items:end center;z-index:30}.modal{background:#fff;width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eee;width:34px;height:34px;border-radius:10px}.split{display:grid;grid-template-columns:1fr 1fr;gap:9px}.checkrow{display:flex;gap:8px;align-items:center;font-size:13px;margin:8px 0}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dfe5e1;height:70px;display:flex;justify-content:center;z-index:12}nav button{width:min(16.66%,135px);border:0;background:transparent;color:#89938d;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:17px}nav button span{font-size:9px}nav button.active{color:#17382d;font-weight:900}.hidden{display:none!important}@media(max-width:720px){main{padding:13px 10px}.hero{padding:17px}.hero h1{font-size:21px}.stats{gap:6px}.stat{padding:11px 8px}.stat b{font-size:18px}.salegrid,.settingsgrid{grid-template-columns:1fr}.cart{position:static}.thumb{width:46px;height:46px}.rowactions{display:none}.profile select{max-width:118px}.split{grid-template-columns:1fr}.hero .action{padding:10px;font-size:12px}}
</style>
</head>
<body><div class="app"><header><div class="brand"><div class="logo">L&M</div><div><strong>Importadora</strong><span>Ventas · Inventario · Red</span></div></div><div class="profile"><small>Perfil activo</small><select id="profile"></select></div></header><main id="content"></main><nav id="nav"></nav></div><div id="modal"></div>
<script>
const seed={
profiles:[
{id:'mauro',name:'Mauro',branch:'Santa Cruz',role:'Administrador'},
{id:'laura',name:'Laura',branch:'Cochabamba',role:'Administrador'},
{id:'lapaz',name:'Responsable La Paz',branch:'La Paz',role:'Encargado'},
{id:'sucre',name:'Sucre',branch:'Sucre',role:'Encargado'}],
products:[
{id:'p1',name:'Auto RC Deportivo',variant:'Rojo',code:'AUT-001-R',emoji:'🏎️'},
{id:'p2',name:'Auto RC Deportivo',variant:'Azul',code:'AUT-001-A',emoji:'🚙'},
{id:'p3',name:'Dinosaurio T-Rex',variant:'Verde',code:'DIN-014-V',emoji:'🦖'},
{id:'p4',name:'Muñeca Fashion',variant:'Vestido rosado',code:'MUN-021-R',emoji:'🧸'},
{id:'p5',name:'Camión Constructor',variant:'Amarillo',code:'CAM-008-A',emoji:'🚚'}],
inventory:{
'Santa Cruz':{p1:{stock:8,price:180,cost:105},p2:{stock:4,price:180,cost:105},p3:{stock:12,price:95,cost:52},p4:{stock:3,price:120,cost:68},p5:{stock:7,price:135,cost:79}},
'Cochabamba':{p1:{stock:5,price:175,cost:105},p2:{stock:7,price:175,cost:105},p3:{stock:6,price:100,cost:52},p4:{stock:11,price:125,cost:68},p5:{stock:2,price:135,cost:79}},
'La Paz':{p1:{stock:3,price:190,cost:105},p2:{stock:1,price:190,cost:105},p3:{stock:4,price:105,cost:52},p4:{stock:5,price:120,cost:68},p5:{stock:8,price:140,cost:79}},
'Sucre':{p1:{stock:0,price:180,cost:105},p2:{stock:0,price:180,cost:105},p3:{stock:2,price:100,cost:52},p4:{stock:0,price:120,cost:68},p5:{stock:1,price:135,cost:79}}},
visibility:{
'Santa Cruz':{'Cochabamba':true,'La Paz':true,'Sucre':true},
'Cochabamba':{'Santa Cruz':true,'La Paz':true,'Sucre':false},
'La Paz':{'Santa Cruz':true,'Cochabamba':true,'Sucre':false},
'Sucre':{'Santa Cruz':true,'Cochabamba':false,'La Paz':false}},
requests:[],sales:[]};
const clone=x=>JSON.parse(JSON.stringify(x));
let state;try{state=JSON.parse(localStorage.getItem('lm_v11'))||clone(seed)}catch(e){state=clone(seed)}
let current=localStorage.getItem('lm_profile')||'mauro',view='Inicio',query='',cart={},lastReceipt=null;
const content=document.getElementById('content'),nav=document.getElementById('nav'),modal=document.getElementById('modal'),profile=document.getElementById('profile');
const $=s=>document.querySelector(s),money=n=>'Bs '+Number(n||0).toFixed(0),save=()=>localStorage.setItem('lm_v11',JSON.stringify(state));
function me(){return state.profiles.find(p=>p.id===current)||state.profiles[0]}function branch(){return me().branch}function inv(b,id){return state.inventory[b]?.[id]||{stock:0,price:0,cost:0}}
function setupProfiles(){profile.innerHTML=state.profiles.map(p=>`<option value="${p.id}" ${p.id===current?'selected':''}>${p.name} · ${p.branch}</option>`).join('');profile.onchange=()=>{current=profile.value;localStorage.setItem('lm_profile',current);cart={};render()}}
const navItems=[['Inicio','⌂'],['Inventario','▣'],['Ventas','🛒'],['Red L&M','◎'],['Solicitudes','🔔'],['Ajustes','⚙']];
function renderNav(){nav.innerHTML=navItems.map(([v,i])=>`<button class="${view===v?'active':''}" onclick="view='${v}';render()">${i}<span>${v}</span></button>`).join('')}
function searchBox(){return `<div class="toolbar"><div class="search">🔎 <input placeholder="Buscar nombre, variante o código" value="${query.replace(/"/g,'&quot;')}" oninput="query=this.value;render()"></div></div>`}
function filtered(){let q=query.toLowerCase();return state.products.filter(p=>(p.name+' '+p.variant+' '+p.code).toLowerCase().includes(q))}
function productRow(p,b,mode='normal') {let d=inv(b,p.id);return `<div class="product ${mode==='sale'?'click':''}" ${mode==='sale'?`onclick="addCart('${p.id}',1)"`:''}><div class="thumb">${p.image?`<img src="${p.image}">`:p.emoji||'📦'}</div><div class="info"><b>${p.name}</b><span>${p.variant||'Sin variante'}</span><small>${p.code}</small></div><div class="numbers"><b>${money(d.price)}</b><span class="${d.stock<=3?'low':''}">${d.stock} un.</span></div>${mode==='edit'?`<div class="rowactions"><button class="iconbtn" onclick="openProduct('${p.id}')">✏️</button></div>`:''}</div>`}
function list(b,mode='normal'){return `<div class="products">${filtered().map(p=>productRow(p,b,mode)).join('')||'<div class="empty">No se encontraron productos.</div>'}</div>`}
function salesToday(b){let key=new Date().toISOString().slice(0,10);return state.sales.filter(s=>s.branch===b&&s.date.slice(0,10)===key).reduce((a,s)=>a+s.total,0)}
function render(){setupProfiles();renderNav();let b=branch(),c=content;if(view==='Inicio'){let total=state.products.reduce((a,p)=>a+inv(b,p.id).stock,0),low=state.products.filter(p=>inv(b,p.id).stock<=3).length;c.innerHTML=`<section class="hero"><div><small>L&M IMPORTADORA · V1.1</small><h1>Hola, ${me().name}</h1><p>${b} · ${me().role}</p></div><button class="action" onclick="view='Ventas';render()">+ Nueva venta</button></section><div class="stats"><div class="stat"><span>Stock actual</span><b>${total}</b><small>unidades</small></div><div class="stat"><span>Ventas hoy</span><b>${money(salesToday(b))}</b><small>registrado</small></div><div class="stat"><span>Stock bajo</span><b>${low}</b><small>variantes</small></div></div><h2>Mi inventario</h2>${list(b)}`}
if(view==='Inventario')c.innerHTML=`<div class="title"><h1>📦 Mi inventario</h1><p>${b}: cada sucursal controla su stock y precio.</p></div><div class="toolbar"><button class="primary" onclick="openProduct()">+ Producto</button><button class="secondary" onclick="openStockAdjust()">± Ajustar stock</button></div>${searchBox()}${list(b,'edit')}`;
if(view==='Ventas'){let total=Object.entries(cart).reduce((a,[id,q])=>a+inv(b,id).price*q,0);let rows=state.products.filter(p=>cart[p.id]).map(p=>`<div class="cartrow"><div><b>${p.name}</b><small>${p.variant}</small></div><div><div>${money(inv(b,p.id).price*cart[p.id])}</div><div class="qty"><button onclick="addCart('${p.id}',-1)">−</button> ${cart[p.id]} <button onclick="addCart('${p.id}',1)">+</button></div></div></div>`).join('');c.innerHTML=`<div class="title"><h1>🛒 Nueva venta</h1><p>Venta desde ${b}. Al confirmar se descuenta el stock.</p></div>${searchBox()}<div class="salegrid"><div>${list(b,'sale')}</div><aside class="cart"><h3>🧾 Venta actual</h3>${rows||'<p>Selecciona un producto.</p>'}<div class="field"><label>Cliente (opcional)</label><input id="customer" placeholder="Nombre del cliente"></div><div class="field"><label>Forma de pago</label><select id="pay"><option>QR</option><option>Efectivo</option><option>Transferencia</option><option>Otro</option></select></div><div class="total"><span>Total</span><b>${money(total)}</b></div><button class="primary" ${total?'':'disabled'} onclick="confirmSale()">Confirmar venta</button></aside></div>`}
if(view==='Red L&M'){let others=state.profiles.filter(p=>p.branch!==b);c.innerHTML=`<div class="title"><h1>🌐 Red L&M</h1><p>Solo ves los inventarios que su propietario decidió compartir contigo.</p></div>${searchBox()}${others.map(p=>{let visible=!!state.visibility[p.branch]?.[b];return `<section class="network"><div class="networkhead"><div><b>${p.branch}</b> · ${p.name}</div><span class="pill ${visible?'':'off'}">${visible?'Visible':'Privado'}</span></div>${visible?list(p.branch):'<div class="empty" style="padding:22px">Este inventario no está compartido contigo.</div>'}${visible?`<button class="secondary" onclick="openRequest('${p.branch}')">⇄ Solicitar producto</button>`:''}</section>`}).join('')}`}
if(view==='Solicitudes'){let mine=state.requests.filter(r=>r.from===b||r.to===b);c.innerHTML=`<div class="title"><h1>🔔 Solicitudes</h1><p>Pedidos entre sucursales.</p></div><div class="requests">${mine.map(r=>{let p=state.products.find(x=>x.id===r.productId);return `<div class="request"><div class="requesttop"><div><b>${p?.name||'Producto'}</b><div><small>${r.from} → ${r.to} · ${r.qty} un.</small></div></div><span class="pill ${r.status==='Pendiente'?'':'off'}">${r.status}</span></div>${r.to===b&&r.status==='Pendiente'?`<div style="margin-top:10px"><button class="primary" onclick="resolveRequest('${r.id}','Aceptada')">Aceptar</button> <button class="danger" onclick="resolveRequest('${r.id}','Rechazada')">Rechazar</button></div>`:''}</div>`}).join('')||'<div class="empty">No hay solicitudes para este perfil.</div>'}</div>`}
if(view==='Ajustes'){let vis=state.visibility[b]||{};c.innerHTML=`<div class="title"><h1>⚙ Configuración</h1><p>Control de visibilidad de tu propio inventario.</p></div><div class="settingsgrid"><section class="card"><h3>Compartir mi stock</h3><p style="font-size:13px;color:#748178">Tú decides quién puede ver cantidades y precios de ${b}.</p>${state.profiles.filter(p=>p.branch!==b).map(p=>`<div class="permission"><div><b>${p.name}</b><small style="display:block;color:#89938d">${p.branch}</small></div><input type="checkbox" ${vis[p.branch]?'checked':''} onchange="toggleVisibility('${p.branch}',this.checked)"></div>`).join('')}</section><section class="card"><h3>Datos locales de prueba</h3><p style="font-size:13px;color:#748178">Esta V1.1 guarda cambios en este dispositivo. La siguiente conexión a Supabase sincronizará usuarios y ciudades online.</p><button class="danger" onclick="resetDemo()">Restablecer demo</button></section></div>`}
}
function addCart(id,d){let available=inv(branch(),id).stock;cart[id]=Math.max(0,Math.min(available,(cart[id]||0)+d));if(!cart[id])delete cart[id];render()}
function confirmSale(){let b=branch(),items=Object.entries(cart).filter(([,q])=>q>0);if(!items.length)return;for(let [id,q] of items){if(inv(b,id).stock<q)return alert('Stock insuficiente.')}let total=items.reduce((a,[id,q])=>a+inv(b,id).price*q,0),sale={id:'s'+Date.now(),branch:b,user:me().name,date:new Date().toISOString(),customer:$('#customer')?.value||'Consumidor final',pay:$('#pay')?.value||'QR',total,items:items.map(([id,q])=>({id,q,price:inv(b,id).price}))};items.forEach(([id,q])=>state.inventory[b][id].stock-=q);state.sales.unshift(sale);save();cart={};lastReceipt=sale;openReceipt(sale)}
function openReceipt(s){let items=s.items.map(i=>{let p=state.products.find(x=>x.id===i.id);return `<div class="line"><span>${p.name} · ${p.variant}<br><small>${i.q} × ${money(i.price)}</small></span><b>${money(i.q*i.price)}</b></div>`}).join('');showModal(`<div class="modalhead"><h2>Recibo</h2><button class="close" onclick="closeModal()">✕</button></div><div class="receipt"><h3>L&M IMPORTADORA</h3><div style="text-align:center;color:#777">${s.branch} · ${new Date(s.date).toLocaleString()}</div><p><b>Cliente:</b> ${s.customer}<br><b>Pago:</b> ${s.pay}<br><b>Atendido por:</b> ${s.user}</p>${items}<div class="line sum"><span>TOTAL</span><b>${money(s.total)}</b></div><button class="primary" onclick="window.print()">Imprimir / Guardar PDF</button></div>`)}
function openProduct(id){let p=id?state.products.find(x=>x.id===id):null,d=p?inv(branch(),p.id):null;showModal(`<div class="modalhead"><h2>${p?'Editar producto':'Nuevo producto'}</h2><button class="close" onclick="closeModal()">✕</button></div><div class="field"><label>Nombre</label><input id="pn" value="${p?.name||''}"></div><div class="split"><div class="field"><label>Variante</label><input id="pv" value="${p?.variant||''}" placeholder="Color / modelo"></div><div class="field"><label>Código</label><input id="pc" value="${p?.code||''}" placeholder="LYM-001"></div></div><div class="field"><label>Foto de referencia</label><input id="pi" type="file" accept="image/*" capture="environment"></div><div class="split"><div class="field"><label>Precio ${branch()}</label><input id="pp" type="number" value="${d?.price||''}"></div><div class="field"><label>Costo</label><input id="pco" type="number" value="${d?.cost||''}"></div></div><div class="field"><label>Stock inicial / actual</label><input id="ps" type="number" value="${d?.stock??0}"></div><button class="primary" onclick="saveProduct('${p?.id||''}')">Guardar</button>`)}
function saveProduct(id){let name=$('#pn').value.trim(),code=$('#pc').value.trim();if(!name||!code)return alert('Nombre y código son obligatorios.');let finish=image=>{let pid=id||'p'+Date.now(),p=id?state.products.find(x=>x.id===id):{id:pid,emoji:'📦'};Object.assign(p,{name,variant:$('#pv').value.trim(),code,image:image||p.image});if(!id){state.products.push(p);Object.keys(state.inventory).forEach(b=>state.inventory[b][pid]={stock:0,price:0,cost:0})}state.inventory[branch()][pid]={stock:+$('#ps').value||0,price:+$('#pp').value||0,cost:+$('#pco').value||0};save();closeModal();render()};let f=$('#pi').files[0];if(f){let r=new FileReader;r.onload=()=>finish(r.result);r.readAsDataURL(f)}else finish(null)}
function openStockAdjust(){showModal(`<div class="modalhead"><h2>Ajustar stock</h2><button class="close" onclick="closeModal()">✕</button></div><div class="field"><label>Producto</label><select id="ap">${state.products.map(p=>`<option value="${p.id}">${p.name} · ${p.variant}</option>`).join('')}</select></div><div class="field"><label>Cantidad (+ ingreso / − salida)</label><input id="aq" type="number" value="1"></div><div class="field"><label>Motivo</label><input id="am" placeholder="Compra, corrección, merma..."></div><button class="primary" onclick="adjustStock()">Aplicar ajuste</button>`)}
function adjustStock(){let id=$('#ap').value,q=+$ ('#aq').value||0,b=branch();state.inventory[b][id].stock=Math.max(0,state.inventory[b][id].stock+q);save();closeModal();render()}
function openRequest(to){showModal(`<div class="modalhead"><h2>Solicitar mercadería</h2><button class="close" onclick="closeModal()">✕</button></div><div class="notice">Solicitud desde ${branch()} hacia ${to}.</div><div class="field"><label>Producto</label><select id="rp">${filtered().map(p=>`<option value="${p.id}">${p.name} · ${p.variant} (${inv(to,p.id).stock} disp.)</option>`).join('')}</select></div><div class="field"><label>Cantidad</label><input id="rq" type="number" min="1" value="1"></div><button class="primary" onclick="createRequest('${to}')">Enviar solicitud</button>`)}
function createRequest(to){let id=$('#rp').value,q=Math.max(1,+$('#rq').value||1);state.requests.unshift({id:'r'+Date.now(),from:branch(),to,productId:id,qty:q,status:'Pendiente',date:new Date().toISOString()});save();closeModal();view='Solicitudes';render()}
function resolveRequest(id,status){let r=state.requests.find(x=>x.id===id);if(!r)return;if(status==='Aceptada'){let available=inv(r.to,r.productId).stock;if(available<r.qty)return alert('No hay stock suficiente para aceptar.');state.inventory[r.to][r.productId].stock-=r.qty;state.inventory[r.from][r.productId].stock+=r.qty}r.status=status;save();render()}
function toggleVisibility(other,on){state.visibility[branch()][other]=on;save();render()}
function resetDemo(){if(confirm('¿Restablecer todos los datos de esta demo?')){state=clone(seed);save();cart={};render()}}
function showModal(html){modal.innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){modal.innerHTML=''}
setupProfiles();render();
</script></body></html>
